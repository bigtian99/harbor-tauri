name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload to, for example v1.0. Leave empty to use package.json version.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # bundles: 空 = 平台默认；Linux 只打 deb（跳过 AppImage）。
          # 内置 JDK/Maven 后 AppImage 的 linuxdeploy 易失败（strip/.relr.dyn 或大资源树）。
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            label: 'macOS ARM64'
            ops: false
            bundles: ''
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            label: 'macOS x64'
            ops: false
            bundles: ''
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            label: 'Linux x64'
            ops: false
            bundles: 'deb'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            label: 'Windows x64'
            ops: false
            bundles: 'nsis'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            label: 'macOS ARM64 OPS'
            ops: true
            bundles: ''
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            label: 'Windows x64 OPS'
            ops: true
            bundles: 'nsis'

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            xdg-utils

      - name: Install frontend dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile || (
            echo "::warning::首次 pnpm install 失败，清理 node_modules 与 store 缓存后重试"
            rm -rf node_modules
            pnpm store prune || true
            pnpm install --frozen-lockfile
          )

      # 完整版才缓存/下载 Maven+JDK；OPS 与 full 必须分 key，避免空包与胖包互相污染
      - name: Cache bundle-tools
        if: ${{ !matrix.ops }}
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/bundle-tools
          key: bundle-tools-${{ matrix.target }}-mvn3.9.9-jdk21-slim2

      # tauri.conf.json 声明了 resources/bundle-tools/**/*，目录为空会导致 glob 匹配失败
      - name: Download bundled Maven and JDK
        shell: bash
        env:
          # OPS 无本地 mvn/javac 路径，跳过内置工具（仅写 .keep 占位）
          SKIP_BUNDLE_TOOLS: ${{ matrix.ops && '1' || '' }}
        run: |
          node scripts/prepare-bundle-resources.mjs
          # OPS：清掉可能被 checkout/缓存带入的胖 bundle-tools，只留占位
          if [[ "${SKIP_BUNDLE_TOOLS}" == "1" ]]; then
            rm -rf src-tauri/resources/bundle-tools
          fi
          node scripts/download-bundle-tools.mjs
          echo "---- bundle-tools size ----"
          du -sh src-tauri/resources/bundle-tools src-tauri/resources/bundle-tools/* 2>/dev/null || true
          echo "---- templates size ----"
          du -sh templates 2>/dev/null || true
          df -h . | tail -1

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS_MODE: ${{ matrix.ops && 'true' || '' }}
          # 若日后重新启用 AppImage，避免 linuxdeploy 内置 strip 撞 .relr.dyn
          NO_STRIP: ${{ matrix.platform == 'ubuntu-22.04' && 'true' || '' }}
        with:
          tauriScript: pnpm exec tauri
          args: --target ${{ matrix.target }}${{ matrix.bundles != '' && format(' --bundles {0}', matrix.bundles) || '' }}

      # OPS / 非 OPS 会产出同名 dmg/exe，不改名会在 release 上传时撞名 →
      # softprops 调 update-a-release-asset 404（Not Found）
      - name: Collect unique-named assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          suffix="${{ matrix.ops && 'ops' || 'std' }}"
          # 只收安装包，不收 .app 目录（体积大且无法当 release asset 下载用）
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            ext="${base##*.}"
            name="${base%.*}"
            # 已含 ops 标记则不再重复加
            if [[ "$suffix" == "ops" && "$base" != *ops* && "$base" != *OPS* ]]; then
              out="${name}-ops.${ext}"
            else
              out="$base"
            fi
            # 仍冲突则加 target 后缀
            if [[ -e "release-assets/$out" ]]; then
              out="${name}-${{ matrix.target }}.${ext}"
            fi
            echo "pack: $f -> release-assets/$out"
            cp "$f" "release-assets/$out"
          done < <(find "src-tauri/target/${{ matrix.target }}/release/bundle" \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.nsis.zip' \) \
            -type f -print0 2>/dev/null || true)

          echo "---- release-assets ----"
          ls -la release-assets || true
          if ! find release-assets -type f -print -quit | grep -q .; then
            echo "::error::No installers found under bundle for ${{ matrix.label }}"
            find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f 2>/dev/null | head -50 || true
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
            tag="$INPUT_RELEASE_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$(node -p "require('./package.json').version")"
            tag="v${version}"
          else
            tag="$REF_NAME"
          fi

          if [[ "$tag" != v* ]]; then
            echo "::error::Release tag must start with v, got: $tag"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare asset list
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          # 扁平化 + 去重文件名（后写覆盖前写并告警）
          find artifacts -type f | sort | while read -r f; do
            base="$(basename "$f")"
            if [[ -e "upload/$base" ]]; then
              echo "::warning::duplicate asset name $base — renaming with parent dir"
              parent="$(basename "$(dirname "$f")")"
              base="${parent}-${base}"
            fi
            cp "$f" "upload/$base"
          done

          echo "---- files to upload ----"
          ls -la upload
          count="$(find upload -type f | wc -l | tr -d ' ')"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No build artifacts were downloaded for the release"
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # 不用 softprops：同名 asset 会打 update-a-release-asset 且 404
      # 改用 gh：先确保 Release 存在，再 --clobber 上传
      # tauri-action 可能先创建空 Release；此处始终用 notes-file 写入/覆盖说明
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail

          node scripts/release-notes.mjs "$TAG" --out release-notes.md
          echo "---- release notes preview ----"
          head -40 release-notes.md || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — update notes and publish"
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest \
              || gh release create "$TAG" \
                --title "$TAG" \
                --notes-file release-notes.md \
                --verify-tag
          fi

          # 上传全部安装包；--clobber 覆盖同名，避免 update asset 404
          shopt -s nullglob
          files=(upload/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::upload/ is empty"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

          gh release edit "$TAG" --latest --notes-file release-notes.md || true

          echo "---- release assets ----"
          # 注意：部分 gh 版本没有 isLatest 字段，只用稳定字段
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets \
            --jq '{tag:.tagName, draft:.isDraft, prerelease:.isPrerelease, assets:[.assets[].name]}'
