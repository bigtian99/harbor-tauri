<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动漫模板三选一</title>
  <style>
    :root {
      --bg: #111;
      --card: #1a1a1a;
      --text: #f5f5f5;
      --muted: #aaa;
      --accent: #e60012;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 24px 12px;
      border-bottom: 1px solid #333;
    }
    header h1 { margin: 0 0 6px; font-size: 22px; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      flex-wrap: wrap;
      border-bottom: 1px solid #333;
    }
    .tabs button {
      border: 1px solid #444;
      background: var(--card);
      color: var(--text);
      padding: 10px 14px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 13px;
      text-align: left;
      min-width: 180px;
    }
    .tabs button.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .tabs button strong { display: block; font-size: 14px; margin-bottom: 2px; }
    .tabs button span { color: var(--muted); font-size: 12px; }
    .stage {
      height: calc(100vh - 150px);
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .hint {
      padding: 8px 24px;
      font-size: 12px;
      color: var(--muted);
    }
    .hint code { color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>动漫落地页 · 三版对比</h1>
    <p>点选下方版本预览。挑中后告诉我编号（A / B / C），我再定稿并补 README。</p>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" class="active" data-ver="A" data-dir="anime">
      <strong>A · 周刊开战页</strong>
      <span>纸白 + 血红 · 冲击波 CTA</span>
    </button>
    <button type="button" data-ver="B" data-dir="anime-1">
      <strong>B · 墨点章扉</strong>
      <span>黑底网纹 + 朱印 · 竖章气质</span>
    </button>
    <button type="button" data-ver="C" data-dir="anime-2">
      <strong>C · 分镜爆炸</strong>
      <span>夜蓝 + 青粉 · GO!! 音效字</span>
    </button>
  </div>
  <p class="hint">本地演示已注入：名称「漫刃」。正式生成仍用 <code>{{NAME}}</code> / <code>{{LOGO}}</code> / <code>{{DOWNLOAD_URL}}</code>。</p>
  <div class="stage">
    <iframe id="preview" title="模板预览"></iframe>
  </div>
  <script>
  (async function () {
    var frame = document.getElementById("preview");
    var buttons = Array.prototype.slice.call(document.querySelectorAll(".tabs button"));

    async function show(dir) {
      var res = await fetch("./" + dir + "/index.html");
      var html = await res.text();
      var base = new URL("./" + dir + "/", location.href).href;
      html = html
        .split("{{NAME}}").join("漫刃")
        .split("{{LOGO}}").join("./image/logo.png")
        .split("{{DOWNLOAD_URL}}").join("https://example.com/manren.apk");
      html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + base + '">');
      frame.srcdoc = html;
    }

    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        buttons.forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        show(btn.getAttribute("data-dir"));
      });
    });

    show("anime");
  })();
  </script>
</body>
</html>
