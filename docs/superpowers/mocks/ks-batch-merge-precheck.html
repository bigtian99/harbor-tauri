<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KS 批量打包 · 可选合并预检（交互稿）</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --elev: #182338;
      --border: #2a3a55;
      --text: #e8eef9;
      --muted: #8b9bb8;
      --primary: #3b9eff;
      --primary-dim: rgba(59, 158, 255, 0.18);
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 50% at 10% 0%, rgba(59, 158, 255, 0.12), transparent 50%),
        var(--bg);
      color: var(--text);
      padding: 32px 16px 64px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .hint { color: var(--muted); font-size: 13px; margin-bottom: 20px; max-width: 720px; line-height: 1.5; }
    .stage {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      position: relative;
    }
    .title-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; gap: 12px;
    }
    .title-row h2 { margin: 0; font-size: 16px; }
    .badge {
      font-size: 11px; padding: 3px 8px; border-radius: 999px;
      background: var(--primary-dim); color: var(--primary); font-weight: 600;
    }
    label.field { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
    select {
      width: 100%;
      background: var(--elev);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 13px;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .switch {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--elev);
      margin-top: 14px; cursor: pointer; user-select: none;
    }
    .switch input { width: 16px; height: 16px; accent-color: var(--primary); }
    .switch strong { font-size: 13px; }
    .switch span { font-size: 11px; color: var(--muted); display: block; }
    .merge-block { display: none; margin-top: 12px; }
    .merge-block.on { display: block; }
    .progress-wrap { margin: 12px 0 8px; }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--muted); margin-bottom: 6px;
    }
    .bar {
      height: 8px; border-radius: 999px; background: #0f1729; overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--primary), #60a5fa);
      transition: width .25s ease;
      position: relative;
    }
    .bar.live > i::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
      animation: shimmer 1.1s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }
    .repo-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .repo {
      border: 1px solid var(--border);
      background: var(--elev);
      border-radius: 10px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      align-items: center;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    .repo.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary-dim), 0 0 20px rgba(59,158,255,.15);
      transform: translateX(2px);
    }
    .repo .name { font-size: 13px; font-weight: 600; }
    .repo .path { font-size: 11px; color: var(--muted); grid-column: 1 / -1; word-break: break-all; }
    .st {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      border: 1px solid transparent;
    }
    .st.wait { color: var(--muted); background: #0f1729; border-color: var(--border); }
    .st.run { color: var(--primary); background: var(--primary-dim); }
    .st.ok { color: var(--ok); background: rgba(52,211,153,.12); }
    .st.conflict { color: var(--warn); background: rgba(251,191,36,.12); cursor: pointer; }
    .st.err { color: var(--danger); background: rgba(248,113,113,.12); }
    .st.merge { color: #a78bfa; background: rgba(167,139,250,.14); }
    .st.pack { color: var(--primary); background: var(--primary-dim); }
    .summary { font-size: 11px; color: var(--muted); margin-top: 2px; grid-column: 1 / -1; }
    .actions {
      display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;
    }
    button {
      border: 0; border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    button.primary { background: var(--primary); color: #041018; }
    button.primary:disabled { opacity: .45; cursor: not-allowed; }
    button.pulse {
      animation: btnPulse .9s ease-in-out infinite;
    }
    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59,158,255,.5); }
      50% { box-shadow: 0 0 0 6px rgba(59,158,255,0); }
    }
    .toast {
      margin-top: 12px; font-size: 12px; color: var(--muted);
      padding: 8px 10px; border-radius: 8px; background: #0f1729; border: 1px dashed var(--border);
      display: none;
    }
    .toast.on { display: block; }

    /* —— 开始后的运行层 —— */
    .run-panel {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid color-mix(in srgb, var(--primary) 45%, var(--border));
      background: linear-gradient(160deg, rgba(59,158,255,.1), transparent 55%), var(--elev);
      animation: runIn .28s ease;
    }
    .run-panel.on { display: block; }
    @keyframes runIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .phase-steps {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .phase {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted); background: #0f1729;
    }
    .phase.current {
      color: #041018; background: var(--primary); border-color: transparent;
      animation: phasePop .35s ease;
    }
    .phase.done { color: var(--ok); border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.1); }
    @keyframes phasePop {
      from { transform: scale(.92); }
      to { transform: scale(1); }
    }
    .run-msg {
      font-size: 13px; font-weight: 600; margin-bottom: 8px;
      min-height: 1.3em;
    }
    .run-msg .spin {
      display: inline-block; width: 12px; height: 12px; margin-right: 6px;
      border: 2px solid var(--primary-dim); border-top-color: var(--primary);
      border-radius: 50%; vertical-align: -2px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .log-line {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px; color: var(--muted); line-height: 1.55;
      max-height: 120px; overflow: auto;
      margin-top: 10px; padding: 8px 10px;
      background: #0b1220; border-radius: 8px; border: 1px solid var(--border);
    }
    .log-line div { animation: fadeRow .25s ease; }
    @keyframes fadeRow {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .dimmed { opacity: .45; pointer-events: none; }

    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
      align-items: center; justify-content: center; padding: 16px; z-index: 20;
    }
    .overlay.on { display: flex; }
    .sheet {
      width: min(420px, 100%); background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
      animation: runIn .25s ease;
    }
    .sheet h3 { margin: 0 0 8px; font-size: 15px; }
    .sheet pre {
      margin: 0 0 12px; font-size: 11px; color: var(--muted); white-space: pre-wrap;
      background: var(--elev); padding: 10px; border-radius: 8px; max-height: 160px; overflow: auto;
    }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  </style>
</head>
<body>
  <div style="max-width:560px;margin:0 auto 16px;">
    <h1>交互验证稿 · 批量打包并发布 + 可选合并</h1>
    <p class="hint">
      勾选「先合并再打包」→ 选源分支看并行预检。点<strong>开始</strong>后会出现运行面板：阶段切换、总进度条扫光、逐仓状态变化。
    </p>
  </div>

  <div class="stage" id="stage">
    <div id="formArea">
      <div class="title-row">
        <h2>批量打包并发布</h2>
        <span class="badge">3 个部署 · demo 环境</span>
      </div>
      <div class="meta">命名空间：klcj-test · 将更新：api / web / admin</div>

      <label class="field">目标分支（打包用）</label>
      <select id="target">
        <option value="origin/rc-master">origin/rc-master</option>
        <option value="origin/test">origin/test</option>
        <option value="origin/dev">origin/dev</option>
      </select>

      <label class="switch" for="mergeOn">
        <input type="checkbox" id="mergeOn" />
        <div>
          <strong>先合并再打包</strong>
          <span>各仓库统一：源分支 → 目标分支；合前并行预检冲突</span>
        </div>
      </label>

      <div class="merge-block" id="mergeBlock">
        <div class="row-2">
          <div>
            <label class="field">源分支</label>
            <select id="source">
              <option value="">请选择</option>
              <option value="origin/feature/pay">origin/feature/pay</option>
              <option value="origin/feature/ui">origin/feature/ui</option>
              <option value="origin/hotfix/login">origin/hotfix/login</option>
            </select>
          </div>
          <div>
            <label class="field">目标分支（合并进）</label>
            <select id="mergeTarget">
              <option value="origin/rc-master">origin/rc-master</option>
              <option value="origin/test">origin/test</option>
              <option value="origin/dev">origin/dev</option>
            </select>
          </div>
        </div>

        <div class="actions" style="margin-top:8px;justify-content:space-between">
          <span class="meta" style="margin:0">点「检查冲突」并行预检（不会自动检查）</span>
          <button type="button" class="ghost" id="btnCheck">检查冲突</button>
        </div>
        <div class="progress-wrap">
          <div class="progress-label">
            <span>冲突预检（并行）</span>
            <span id="progText">尚未检查</span>
          </div>
          <div class="bar"><i id="progBar"></i></div>
        </div>
        <ul class="repo-list" id="repoList"></ul>
      </div>

      <div class="actions">
        <button type="button" class="ghost" id="btnCancel">取消</button>
        <button type="button" class="primary" id="btnStart">开始</button>
      </div>
    </div>

    <!-- 点开始后显示 -->
    <div class="run-panel" id="runPanel">
      <div class="phase-steps">
        <span class="phase" id="phMerge">1. 合并</span>
        <span class="phase" id="phConflict">2. 冲突处理</span>
        <span class="phase" id="phPack">3. 打包发布</span>
        <span class="phase" id="phDone">完成</span>
      </div>
      <div class="run-msg" id="runMsg"><span class="spin"></span>准备中…</div>
      <div class="progress-wrap" style="margin-top:0">
        <div class="progress-label">
          <span id="runPhaseLabel">总体进度</span>
          <span id="runPct">0%</span>
        </div>
        <div class="bar live"><i id="runBar"></i></div>
      </div>
      <ul class="repo-list" id="runRepoList"></ul>
      <div class="log-line" id="runLog"></div>
      <div class="actions" style="margin-top:12px">
        <button type="button" class="ghost" id="btnAbortRun">中止</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div class="overlay" id="conflictOverlay">
    <div class="sheet">
      <h3>冲突处理（示意）</h3>
      <p class="meta" id="conflictRepo"></p>
      <pre id="conflictFiles"></pre>
      <div class="actions" style="margin-top:0">
        <button type="button" class="ghost" id="btnAbort">中止批量</button>
        <button type="button" class="primary pulse" id="btnResolved">已解决，继续</button>
      </div>
    </div>
  </div>

  <script>
    const REPOS = [
      { id: "api", name: "klcj-api", path: "/Users/demo/code/klcj-api", outcome: "ok" },
      { id: "web", name: "official-website-web", path: "/Users/demo/code/official-website-web", outcome: "conflict", files: ["src/App.tsx", "package.json"] },
      { id: "admin", name: "klcj-admin", path: "/Users/demo/code/klcj-admin", outcome: "ok" },
    ];

    const mergeOn = document.getElementById("mergeOn");
    const mergeBlock = document.getElementById("mergeBlock");
    const source = document.getElementById("source");
    const mergeTarget = document.getElementById("mergeTarget");
    const target = document.getElementById("target");
    const repoList = document.getElementById("repoList");
    const progBar = document.getElementById("progBar");
    const progText = document.getElementById("progText");
    const toast = document.getElementById("toast");
    const overlay = document.getElementById("conflictOverlay");
    const formArea = document.getElementById("formArea");
    const runPanel = document.getElementById("runPanel");
    const runBar = document.getElementById("runBar");
    const runPct = document.getElementById("runPct");
    const runMsg = document.getElementById("runMsg");
    const runLog = document.getElementById("runLog");
    const runRepoList = document.getElementById("runRepoList");
    const btnStart = document.getElementById("btnStart");
    const btnCheck = document.getElementById("btnCheck");

    let checkToken = 0;
    let lastResults = [];
    let running = false;
    let abortRun = false;
    let conflictResolve = null;

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    function syncTargets() {
      mergeTarget.value = target.value;
    }
    target.addEventListener("change", () => {
      syncTargets();
      // 换分支只清空结果，不自动预检（与产品一致）
      if (mergeOn.checked) resetList("分支已变更，请点「检查冲突」");
    });

    mergeOn.addEventListener("change", () => {
      mergeBlock.classList.toggle("on", mergeOn.checked);
      if (mergeOn.checked) {
        syncTargets();
        resetList("请点「检查冲突」并行预检（不会自动检查）");
      } else {
        resetList("未开启合并预检");
      }
    });

    source.addEventListener("change", () => {
      if (mergeOn.checked) resetList("源分支已变更，请点「检查冲突」");
    });
    mergeTarget.addEventListener("change", () => {
      if (mergeOn.checked) resetList("目标分支已变更，请点「检查冲突」");
    });

    function resetList(msg) {
      checkToken++;
      repoList.innerHTML = "";
      progBar.style.width = "0%";
      progText.textContent = msg;
      lastResults = [];
    }

    function stClass(s) {
      return ({ wait: "wait", run: "run", ok: "ok", conflict: "conflict", err: "err", merge: "merge", pack: "pack" })[s] || "wait";
    }
    function stLabel(s, extra) {
      return ({
        wait: "等待",
        run: "检查中",
        ok: "可合并",
        conflict: `有冲突${extra || ""}`,
        err: "失败",
        merge: "合并中",
        pack: "打包中",
        merged: "已合并",
        packed: "已发布",
      })[s] || s;
    }

    function renderRows(el, states, { onConflictClick } = {}) {
      el.innerHTML = "";
      states.forEach((row) => {
        const li = document.createElement("li");
        li.className = "repo" + (row.active ? " active" : "");
        const label = row.status === "merged" ? "已合并"
          : row.status === "packed" ? "已发布"
          : stLabel(row.status, row.files ? ` · ${row.files.length}` : "");
        const cls = row.status === "merged" || row.status === "packed" ? "ok"
          : stClass(row.status);
        li.innerHTML = `
          <div class="name">${row.name}</div>
          <span class="st ${cls}">${label}</span>
          <div class="path">${row.path}</div>
          ${row.summary ? `<div class="summary">${row.summary}</div>` : ""}
        `;
        const badge = li.querySelector(".st");
        if (row.status === "conflict" && onConflictClick) {
          badge.style.cursor = "pointer";
          badge.addEventListener("click", () => onConflictClick(row));
        }
        el.appendChild(li);
      });
    }

    function setPhase(id) {
      ["phMerge", "phConflict", "phPack", "phDone"].forEach((pid) => {
        const n = document.getElementById(pid);
        n.classList.remove("current", "done");
      });
      const order = ["phMerge", "phConflict", "phPack", "phDone"];
      const idx = order.indexOf(id);
      order.forEach((pid, i) => {
        const n = document.getElementById(pid);
        if (i < idx) n.classList.add("done");
        if (i === idx) n.classList.add("current");
      });
    }

    function setRunProgress(pct, msg) {
      const p = Math.max(0, Math.min(100, Math.round(pct)));
      runBar.style.width = p + "%";
      runPct.textContent = p + "%";
      if (msg) {
        runMsg.innerHTML = p >= 100
          ? msg
          : `<span class="spin"></span>${msg}`;
      }
    }

    function log(line) {
      const d = document.createElement("div");
      d.textContent = `[${new Date().toLocaleTimeString()}] ${line}`;
      runLog.appendChild(d);
      runLog.scrollTop = runLog.scrollHeight;
    }

    function showConflict(row) {
      document.getElementById("conflictRepo").textContent = `${row.name} · ${source.value} → ${mergeTarget.value}`;
      document.getElementById("conflictFiles").textContent = (row.files || []).map((f) => `M  ${f}`).join("\n") || "(无文件列表)";
      overlay.classList.add("on");
      return new Promise((resolve) => {
        conflictResolve = resolve;
      });
    }

    function showToast(t) {
      toast.textContent = t;
      toast.classList.add("on");
    }

    async function maybeCheck() {
      if (!mergeOn.checked) return;
      if (!source.value || !mergeTarget.value) {
        resetList("等待选择源分支");
        renderRows(repoList, REPOS.map((r) => ({ ...r, status: "wait" })));
        return;
      }
      const token = ++checkToken;
      const states = REPOS.map((r) => ({ ...r, status: "wait", summary: "" }));
      renderRows(repoList, states, { onConflictClick: showConflictPreview });
      progBar.style.width = "0%";
      progText.textContent = `0 / ${REPOS.length}`;
      states.forEach((s) => { s.status = "run"; });
      renderRows(repoList, states);

      await Promise.all(REPOS.map((repo, idx) => new Promise((resolve) => {
        const delay = 300 + Math.random() * 800;
        setTimeout(() => {
          if (token !== checkToken) return resolve(null);
          if (repo.outcome === "conflict") {
            states[idx].status = "conflict";
            states[idx].files = repo.files;
            states[idx].summary = "预检警告：存在冲突，开始后将进入冲突处理";
          } else {
            states[idx].status = "ok";
            states[idx].summary = "merge-tree 无冲突";
          }
          const done = states.filter((s) => s.status !== "wait" && s.status !== "run").length;
          progBar.style.width = `${(done / REPOS.length) * 100}%`;
          progText.textContent = `${done} / ${REPOS.length}`;
          renderRows(repoList, states, { onConflictClick: showConflictPreview });
          resolve(states[idx]);
        }, delay);
      })));

      if (token !== checkToken) return;
      lastResults = states.map((s) => ({ ...s }));
      const c = states.filter((s) => s.status === "conflict").length;
      progText.textContent = c
        ? `完成：${states.length - c} 可合并 · ${c} 冲突`
        : `完成：全部可合并 (${states.length})`;
    }

    function showConflictPreview(row) {
      document.getElementById("conflictRepo").textContent = `${row.name} · 预览`;
      document.getElementById("conflictFiles").textContent = (row.files || []).map((f) => `M  ${f}`).join("\n");
      overlay.classList.add("on");
      conflictResolve = () => overlay.classList.remove("on");
    }

    async function runPipeline() {
      running = true;
      abortRun = false;
      formArea.classList.add("dimmed");
      btnStart.disabled = true;
      btnStart.classList.add("pulse");
      btnStart.textContent = "执行中…";
      runPanel.classList.add("on");
      runLog.innerHTML = "";
      setRunProgress(0, "启动批量任务…");
      log("批量任务开始");

      const doMerge = mergeOn.checked && !!source.value;
      const states = REPOS.map((r) => {
        const pre = lastResults.find((x) => x.id === r.id);
        return {
          ...r,
          status: "wait",
          files: pre?.files || r.files,
          summary: "",
          active: false,
          hadConflict: pre?.status === "conflict" || r.outcome === "conflict",
        };
      });
      renderRows(runRepoList, states);

      if (doMerge) {
        setPhase("phMerge");
        document.getElementById("runPhaseLabel").textContent = "合并进度";
        for (let i = 0; i < states.length; i++) {
          if (abortRun) break;
          states.forEach((s, j) => { s.active = j === i; });
          states[i].status = "merge";
          states[i].summary = `${source.value} → ${mergeTarget.value}`;
          renderRows(runRepoList, states);
          setRunProgress(((i) / states.length) * 45, `合并中：${states[i].name} (${i + 1}/${states.length})`);
          log(`合并 ${states[i].name}…`);
          await sleep(700);

          if (states[i].hadConflict) {
            setPhase("phConflict");
            states[i].status = "conflict";
            states[i].summary = "等待人工解决冲突…";
            renderRows(runRepoList, states);
            setRunProgress(((i + 0.4) / states.length) * 45, `冲突：${states[i].name} — 请在弹层处理`);
            log(`冲突 ${states[i].name}，打开处理面板`);
            const action = await showConflict(states[i]);
            if (action !== "resolved" || abortRun) {
              log("用户中止");
              setRunProgress(runBar.style.width.replace("%","") * 1, "已中止");
              finishRun(false);
              return;
            }
            setPhase("phMerge");
            log(`${states[i].name} 冲突已解决，继续合并`);
          }

          states[i].status = "merged";
          states[i].summary = "合并成功";
          states[i].active = false;
          renderRows(runRepoList, states);
          setRunProgress(((i + 1) / states.length) * 45, `已合并 ${i + 1}/${states.length}`);
          log(`${states[i].name} 合并完成`);
          await sleep(280);
        }
      } else {
        document.getElementById("phMerge").classList.add("done");
        document.getElementById("phConflict").classList.add("done");
        log("跳过合并");
        setRunProgress(10, "跳过合并，准备打包…");
        await sleep(400);
      }

      if (abortRun) { finishRun(false); return; }

      setPhase("phPack");
      document.getElementById("runPhaseLabel").textContent = "打包发布进度";
      for (let i = 0; i < states.length; i++) {
        if (abortRun) break;
        states.forEach((s, j) => { s.active = j === i; });
        states[i].status = "pack";
        states[i].summary = `构建 ${target.value} → 更新部署`;
        renderRows(runRepoList, states);
        const base = doMerge ? 45 : 10;
        const span = 100 - base;
        setRunProgress(base + ((i) / states.length) * span, `打包发布：${states[i].name}`);
        log(`打包 ${states[i].name}…`);
        await sleep(850);
        states[i].status = "packed";
        states[i].summary = "镜像已推送并更新 Deployment";
        states[i].active = false;
        renderRows(runRepoList, states);
        setRunProgress(base + ((i + 1) / states.length) * span, `已发布 ${i + 1}/${states.length}`);
        log(`${states[i].name} 发布完成`);
        await sleep(200);
      }

      if (abortRun) { finishRun(false); return; }
      setPhase("phDone");
      setRunProgress(100, "✅ 批量完成");
      log("全部完成");
      finishRun(true);
    }

    function finishRun(ok) {
      running = false;
      formArea.classList.remove("dimmed");
      btnStart.disabled = false;
      btnStart.classList.remove("pulse");
      btnStart.textContent = "开始";
      showToast(ok ? "批量流程演示结束（成功）" : "批量流程已中止");
      document.querySelector("#runPanel .bar")?.classList.remove("live");
    }

    btnStart.addEventListener("click", () => {
      if (running) return;
      if (mergeOn.checked && !source.value) {
        showToast("请先选择源分支，或关闭「先合并再打包」");
        return;
      }
      document.querySelector("#runPanel .bar")?.classList.add("live");
      runPipeline();
    });

    document.getElementById("btnCancel").addEventListener("click", () => {
      showToast("已取消（演示）");
    });
    document.getElementById("btnAbortRun").addEventListener("click", () => {
      abortRun = true;
      if (conflictResolve) {
        conflictResolve("abort");
        conflictResolve = null;
        overlay.classList.remove("on");
      }
      log("请求中止…");
    });
    document.getElementById("btnAbort").addEventListener("click", () => {
      overlay.classList.remove("on");
      if (conflictResolve) {
        conflictResolve("abort");
        conflictResolve = null;
      }
      abortRun = true;
    });
    document.getElementById("btnResolved").addEventListener("click", () => {
      overlay.classList.remove("on");
      if (conflictResolve) {
        conflictResolve("resolved");
        conflictResolve = null;
      }
    });

    renderRows(repoList, REPOS.map((r) => ({ ...r, status: "wait" })));
  </script>
</body>
</html>
